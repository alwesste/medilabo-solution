services:

  eureka:
    build:
      context: ./eureka
      dockerfile: Dockerfile
    container_name: eureka
    ports:
      - "9002:9002"
    environment:
      - SPRING_CONFIG_IMPORT=configserver:http://config-server:9101
      - EUREKA_CLIENT_REGISTER_WITH_EUREKA=false
      - EUREKA_CLIENT_FETCH_REGISTRY=false
    networks:
      - medilabo-network
    depends_on:
      config-server:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9002/actuator/health" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s


  config-server:
    build:
      context: ./config-server
      dockerfile: Dockerfile
    container_name: config-server
    ports:
      - "9101:9101"
    environment:
      - GIT_URI=https://github.com/alwesste/medilabo-solution
    networks:
      - medilabo-network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9101/actuator/health" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s


  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    container_name: gateway
    ports:
      - "9003:9003"
    environment:
      - SPRING_CONFIG_IMPORT=configserver:http://config-server:9101
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka:9002/eureka
    networks:
      - medilabo-network
    depends_on:
      config-server:
        condition: service_healthy
      eureka:
        condition: service_healthy


  patient:
    build:
      context: ./patient
      dockerfile: Dockerfile
    container_name: patient
    ports:
      - "9001:9001"
    environment:
      - SPRING_CONFIG_IMPORT=configserver:http://config-server:9101
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/${MYSQL_DATABASE}
      - SPRING_DATASOURCE_USERNAME=${MYSQL_USER}
      - SPRING_DATASOURCE_PASSWORD=${MYSQL_PASSWORD}
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka:9002/eureka
    networks:
      - medilabo-network
    depends_on:
      config-server:
        condition: service_healthy
      eureka:
        condition: service_healthy
      mysql:
        condition: service_healthy

  patient-note:
    build:
      context: ./patient-note
      dockerfile: Dockerfile
    container_name: patient-note
    ports:
      - "9004:9004"
    environment:
      - SPRING_CONFIG_IMPORT=configserver:http://config-server:9101
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka:9002/eureka
      - SPRING_DATA_MONGODB_URI=mongodb://${MONGO_INITDB_ROOT_USERNAME}:${MONGO_INITDB_ROOT_PASSWORD}@mongodb:27017/${MONGO_INITDB_DATABASE}?authSource=admin
      - SPRING_DATA_MONGODB_HOST=mongodb
      - SPRING_DATA_MONGODB_PORT=27017
      - SPRING_DATA_MONGODB_DATABASE=${MONGO_INITDB_DATABASE}
      - SPRING_DATA_MONGODB_USERNAME=${MONGO_INITDB_ROOT_USERNAME}
      - SPRING_DATA_MONGODB_PASSWORD=${MONGO_INITDB_ROOT_PASSWORD}
      - SPRING_DATA_MONGODB_AUTHENTICATION_DATABASE=admin
    networks:
      - medilabo-network
    depends_on:
      config-server:
        condition: service_healthy
      eureka:
        condition: service_healthy
      mongodb:
        condition: service_healthy


  patient-rapport:
    build:
      context: ./patient-rapport
      dockerfile: Dockerfile
    container_name: patient-rapport
    ports:
      - "9005:9005"
    environment:
      - SPRING_CONFIG_IMPORT=configserver:http://config-server:9101
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka:9002/eureka
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/${MYSQL_DATABASE}
      - SPRING_DATASOURCE_USERNAME=${MYSQL_USER}
      - SPRING_DATASOURCE_PASSWORD=${MYSQL_PASSWORD}
    networks:
      - medilabo-network
    depends_on:
      config-server:
        condition: service_healthy
      eureka:
        condition: service_healthy


  medilabo-ui:
    build:
      context: ./medilabo-ui
      dockerfile: Dockerfile
    container_name: medilabo-ui
    ports:
      - "8080:8080"
    environment:
      - SPRING_CONFIG_IMPORT=configserver:http://config-server:9101
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka:9002/eureka
      - GATEWAY_URL=http://gateway:9003
    networks:
      - medilabo-network
    depends_on:
      config-server:
        condition: service_healthy
      eureka:
        condition: service_healthy

  mysql:
    image: mysql:8.0
    container_name: mysql
    ports:
      - "3307:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - medilabo-network
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s


  mongodb:
    image: mongo:7.0
    container_name: mongodb
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_INITDB_ROOT_USERNAME}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_INITDB_ROOT_PASSWORD}
      - MONGO_INITDB_DATABASE=${MONGO_INITDB_DATABASE}
    volumes:
      - mongo-data:/data/db
      - ./patient-note/src/main/resources/data.js:/docker-entrypoint-initdb.d/data.js:ro
    networks:
      - medilabo-network
    healthcheck:
      test: [ "CMD", "mongosh", "--eval", "db.adminCommand('ping')" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

networks:
  medilabo-network:
    driver: bridge
    
volumes:
  mysql-data:
  mongo-data: