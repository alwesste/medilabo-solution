server.port=9005

spring.data.mongodb.uri=mongodb://${MONGO_INITDB_ROOT_USERNAME}:${MONGO_INITDB_ROOT_PASSWORD}@mongodb:27017/${MONGO_INITDB_DATABASE}?authSource=admin

spring.datasource.url=jdbc:mysql://mysql:3306/medilabo
spring.datasource.password=${BDD_PASSWORD}
spring.datasource.username=${BDD_USERNAME}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

eureka.client.serviceUrl.defaultZone=http://eureka:9002/eureka/

gateway.url=http://gateway:9003