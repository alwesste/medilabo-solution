<!doctype html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Medilabo - Liste des Patients</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" />
</head>

<body>

<div class="container">

    <div class="header-section">
        <h1>Liste des patients</h1>
        <a th:href="@{/add/patient}" class="btn btn-success">
            + Ajouter un nouveau patient
        </a>
    </div>

    <div th:if="${#lists.isEmpty(patients)}" class="empty-message">
        <p>Aucun patient trouvé.</p>
    </div>

    <div class="patient-list">
        <div th:each="patient : ${patients}" class="patient-card">

            <div class="patient-info">
                <h3 th:text="${patient.prenom + ' ' + patient.nom}"></h3>
            </div>

            <a th:href="@{/patient/details/{id}(id=${patient.id})}" class="btn btn-primary">
                Sélectionner ce patient
            </a>

        </div>
    </div>

</div>

</body>
</html>
