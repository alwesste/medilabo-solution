<!doctype html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Update a patient</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" />
</head>
<body>
<div class="container">

    <div class="header-section">
        <div>
            <h1>Modifier le Dossier</h1>
            <p style="margin: 5px 0 0 0; color: #64748b; font-size: 16px;">
                Patient : <strong th:text="${patientBean.prenom + ' ' + patientBean.nom}"></strong>
            </p>
        </div>
        <a th:href="@{/patients}" class="btn btn-secondary">← Annuler</a>
    </div>

    <div class="card form-card">
        <h2>Mettre à jour les informations cliniques</h2>

        <form th:action="@{/update/patient/{id}(id=${patientBean.id})}"
              th:object="${patientBean}"
              method="post">

            <input type="hidden" th:field="*{id}"/>

            <div class="form-grid">

                <div class="form-group">
                    <label for="prenom">Prénom</label>
                    <input type="text" id="prenom" th:field="*{prenom}" placeholder="Prénom"/>
                    <span class="error-message" th:if="${#fields.hasErrors('prenom')}" th:errors="*{prenom}"></span>
                </div>

                <div class="form-group">
                    <label for="nom">Nom</label>
                    <input type="text" id="nom" th:field="*{nom}" placeholder="Nom"/>
                    <span class="error-message" th:if="${#fields.hasErrors('nom')}" th:errors="*{nom}"></span>
                </div>

                <div class="form-group">
                    <label for="birthDate">Date de naissance</label>
                    <input type="date" id="birthDate" th:field="*{birthDate}" th:attr="max=${#dates.format(#dates.createNow(), 'yyyy-MM-dd')}"/>
                    <span class="error-message" th:if="${#fields.hasErrors('birthDate')}" th:errors="*{birthDate}"></span>
                </div>

                <div class="form-group">
                    <label for="genre">Genre</label>
                    <select id="genre" th:field="*{genre}">
                        <option value="" disabled selected>-- Sélectionner --</option>
                        <option value="M">Homme</option>
                        <option value="F">Femme</option>
                    </select>
                    <span class="error-message" th:if="${#fields.hasErrors('genre')}" th:errors="*{genre}"></span>
                </div>

                <div class="form-group full-width">
                    <label for="adressePostal">Adresse postale</label>
                    <input type="text" id="adressePostal" th:field="*{adressePostal}" placeholder="Ex: 10 rue du petit train, 75000 Paris"/>
                </div>

                <div class="form-group full-width">
                    <label for="phoneNumber">Numéro de téléphone</label>
                    <input type="tel" id="phoneNumber" th:field="*{phoneNumber}" placeholder="Ex: 01 23 45 67 89"
                           pattern="(\d{10}|\d{3}-\d{3}-\d{4})" required maxlength="10"/>
                </div>
                <span class="error-message" th:if="${#fields.hasErrors('phoneNumber')}" th:errors="*{phoneNumber}"></span>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary">Enregistrer les modifications</button>
                <a th:href="@{/patients}" class="btn btn-secondary">Annuler</a>
            </div>

            <div class="error-message" th:if="${erreur}" th:text="${erreur}"></div>

        </form>
    </div>

</div>
</body>
</html>
