<!doctype html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Medilabo Add a patient</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" />
</head>
<body>
<div class="container">

    <div class="header-section">
        <h1>Ajouter un nouveau patient</h1>
        <a th:href="@{/patients}" class="btn btn-secondary">← Annuler et revenir</a>
    </div>

    <div class="card form-card">
        <h2>Informations d'identité du patient</h2>

        <form th:action="@{/add/patient}" th:object="${patientBean}" method="post">

            <div class="form-grid">

                <div class="form-group">
                    <label for="prenom">Prénom</label>
                    <input type="text" id="prenom" th:field="*{prenom}" placeholder="Ex: Jean"/>
                    <span class="error-message" th:if="${#fields.hasErrors('prenom')}" th:errors="*{prenom}"></span>
                </div>

                <div class="form-group">
                    <label for="nom">Nom</label>
                    <input type="text" id="nom" th:field="*{nom}" placeholder="Ex: DUPONT"/>
                    <span class="error-message" th:if="${#fields.hasErrors('nom')}" th:errors="*{nom}"></span>
                </div>

                <div class="form-group">
                    <label for="birthDate">Date de naissance</label>
                    <input type="date" id="birthDate" th:field="*{birthDate}"/>
                    <span class="error-message" th:if="${#fields.hasErrors('birthDate')}" th:errors="*{birthDate}"></span>
                </div>

                <div class="form-group">
                    <label for="genre">Genre</label>
                    <input type="text" id="genre" th:field="*{genre}" placeholder="M ou F"/>
                    <span class="error-message" th:if="${#fields.hasErrors('genre')}" th:errors="*{genre}"></span>
                </div>

                <div class="form-group full-width">
                    <label for="adressePostal">Adresse postale</label>
                    <input type="text" id="adressePostal" th:field="*{adressePostal}" placeholder="Ex: 12 rue de la Paix, 75000 Paris"/>
                </div>

                <div class="form-group full-width">
                    <label for="phoneNumber">Numéro de téléphone</label>
                    <input type="text" id="phoneNumber" th:field="*{phoneNumber}" placeholder="Ex: 06 12 34 56 78"/>
                </div>

            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-success">Créer la fiche patient</button>
                <a th:href="@{/patients}" class="btn btn-secondary">Annuler</a>
            </div>

        </form>
    </div>

</div>
</body>
</html>
